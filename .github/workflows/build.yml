name: Build Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Name release APK
        run: |
          VERSION_NAME=$(sed -nE 's/.*versionName *= *"([^"]+)".*/\1/p' app/build.gradle.kts)
          mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/HoangCalculator-${VERSION_NAME}.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: HoangCalculator
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
